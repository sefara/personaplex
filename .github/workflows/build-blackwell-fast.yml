name: build-personaplex-dgx-spark-fast

on:
  push:
    branches: [dgx-spark-fast]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run source tests
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.blackwell-fast
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/sefara/personaplex-nvidia-dgx-spark:sha-${{ github.sha }}
            ghcr.io/sefara/personaplex-nvidia-dgx-spark:fast-candidate
          labels: |
            org.opencontainers.image.source=https://github.com/sefara/personaplex
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: echo 'ARM64 image digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
